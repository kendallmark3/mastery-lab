[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mastery-lab"
version = "0.1.0"
description = "Local-first learning loop POC: goals, challenges, submissions, evidence-linked feedback, MCP surface."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mastery-lab = "mastery_lab.__main__:main"

[tool.setuptools]
packages = ["mastery_lab"]

[tool.setuptools.package-data]
mastery_lab = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
